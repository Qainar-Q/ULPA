name: Keep Supabase awake

# Supabase free projects are paused after about a week without any requests
# (e.g. during holidays). Every 3 days this calls the same public summary the
# guest page shows, so that never happens. It uses only the public publishable
# key the website itself uses; no data is exposed or changed.

on:
  schedule:
    - cron: "17 4 */3 * *" # every 3 days, 09:17 Almaty time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" --retry 3 --retry-delay 20 --max-time 30 \
            -X POST "https://lxrjogpmmatpuzellnyu.supabase.co/rest/v1/rpc/public_overview" \
            -H "apikey: sb_publishable_fnfShtPMuOUc2g3CNX-ydA_PAob-rU6" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.txt
            echo "::error::Supabase did not answer normally (HTTP $status). If the project is paused, restore it at supabase.com."
            exit 1
          fi
