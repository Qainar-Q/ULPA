<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a14" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="ULPA — Ғарыштық техника және технология студенттеріне арналған оқу платформасы" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ULPA" />
    <title>ULPA</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.js).
      (function () {
        try {
          var pref = localStorage.getItem("ulpa-theme") || "dark";
          var light = pref === "light" || (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
