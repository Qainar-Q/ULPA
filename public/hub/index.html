<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>1% Better</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1% Better">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="apple-touch-icon" href="/hub/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/hub/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#1c1c1e; --s2:#2c2c2e; --s3:#3a3a3c;
  --t1:#f5f5f7; --t2:#a1a1a6; --t3:#6e6e73;
  --study:#5b8cff; --move:#ff5a5f; --habit:#3ddc97; --todo:#ffb340; --fast:#40c8e0; --eng:#bf7cff;
  --r-lg:22px; --r-md:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--t1);font-family:"Nunito",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--study);outline-offset:2px;border-radius:8px}
.num{font-family:"Nunito",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:800}
.app{max-width:520px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px calc(110px + var(--safe-b));min-height:100vh}
section{display:none}
section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 22px}
.top .sub{color:var(--t2);font-size:13.5px;font-weight:700}
.top h1{font-size:34px;font-weight:900;letter-spacing:-.5px;line-height:1.1;margin-top:2px}
.sync{width:9px;height:9px;border-radius:50%;background:var(--t3);margin-bottom:12px}
.sync.ok{background:var(--habit)} .sync.warn{background:var(--todo)}
.tbtn{color:var(--study);font-weight:800;font-size:15px;padding:6px 2px;margin-bottom:4px}

h2{font-size:20px;font-weight:900;letter-spacing:-.2px;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 .side{font-size:13.5px;font-weight:700;color:var(--t2)}
h2 button.side{color:var(--study)}
.panel{background:var(--s1);border-radius:var(--r-lg);padding:16px}

/* rings hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.hero svg{display:block}
.legend .item{padding:9px 0}
.legend .item + .item{border-top:1px solid var(--s2)}
.legend .lbl{font-size:13px;font-weight:800}
.legend .val{font-size:26px;line-height:1.1;letter-spacing:-.3px}
.legend .val small{font-size:14px;color:var(--t2);font-weight:700;margin-left:2px}
.c-study{color:var(--study)} .c-move{color:var(--move)} .c-habit{color:var(--habit)}
@media(max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* habit tiles */
.tiles{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:74px;text-align:center}
.tile .disc{position:relative;width:70px;height:70px;margin:0 auto}
.tile .disc svg.r{position:absolute;inset:0}
.tile .disc .ic{position:absolute;inset:11px;border-radius:50%;display:grid;place-items:center;background:var(--s1);transition:background .25s}
.tile .disc .ic svg{width:24px;height:24px}
.tile.on .disc .ic{background:var(--hc)}
.tile.on .disc .ic svg{stroke:#000!important}
.tile .nm{font-size:12px;font-weight:700;color:var(--t2);margin-top:6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.on .nm{color:var(--t1)}
.tile .disc.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.1)}}

/* todos */
.add{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:var(--r-md);padding:4px 6px 4px 14px}
.add input{flex:1;min-width:0;padding:10px 0;font-weight:700}
.add input::placeholder{color:var(--t3)}
.add .plus{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center}
.add .plus svg{width:18px;height:18px;stroke:var(--t1)}
.todos{list-style:none;margin-top:8px}
.todos li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--s1)}
.todos li .t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.todos li.done .t{color:var(--t3);text-decoration:line-through}
.todos li .when{font-size:12px;color:var(--todo);font-weight:800}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--s3);flex:0 0 24px;display:grid;place-items:center;transition:.15s}
.cb.on{background:var(--todo);border-color:var(--todo)}
.cb svg{width:13px;height:13px;stroke:#000;opacity:0}
.cb.on svg{opacity:1}
.del{color:var(--t3);padding:4px;display:grid;place-items:center;opacity:.7}
.del svg{width:16px;height:16px;stroke:currentColor}
.del:hover{opacity:1;color:var(--move)}
.empty{color:var(--t3);font-size:14px;font-weight:700;padding:18px 0;text-align:center}

/* week history */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{font-size:12px;font-weight:800;color:var(--t3);margin-bottom:6px}
.week .d.today{color:var(--t1)}
.week svg{display:block;margin:0 auto;width:100%;max-width:44px;height:auto}

/* focus */
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;width:max-content;margin:0 auto}
.seg button{padding:7px 18px;border-radius:9px;font-weight:800;font-size:14px;color:var(--t2)}
.seg button.on{background:var(--s3);color:var(--t1)}
.dial{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:22px auto 8px}
.dial svg{width:100%;height:100%;display:block}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .time{font-size:clamp(52px,16vw,68px);letter-spacing:-1px;line-height:1}
.dial .what{font-size:14px;color:var(--t2);font-weight:800;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
.chip{padding:8px 14px;border-radius:999px;background:var(--s1);font-size:14px;font-weight:800;color:var(--t2);border:1.5px solid transparent}
.chip.on{background:color-mix(in srgb,var(--cc,var(--study)) 18%,transparent);color:var(--cc,var(--study));border-color:color-mix(in srgb,var(--cc,var(--study)) 45%,transparent)}
.chip.dashed{border:1.5px dashed var(--s3);background:none}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:22px}
.big{width:76px;height:76px;border-radius:50%;background:var(--study);display:grid;place-items:center;transition:transform .1s}
.big:active{transform:scale(.94)}
.big svg{width:30px;height:30px;fill:#000}
.small{width:52px;height:52px;border-radius:50%;background:var(--s1);display:grid;place-items:center}
.small svg{width:20px;height:20px;stroke:var(--t1)}
.small:disabled{opacity:.3}
.dur{display:flex;justify-content:center;gap:6px;margin-top:20px}
.dur button{font-size:13px;font-weight:800;color:var(--t3);padding:5px 10px;border-radius:8px}
.dur button.on{color:var(--t1);background:var(--s1)}

.kpi{display:flex;gap:26px;margin-bottom:14px}
.kpi .k{font-size:13px;font-weight:800;color:var(--t2)}
.kpi .v{font-size:28px;letter-spacing:-.4px;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--t2);font-weight:700;margin-left:1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:11px;fill:var(--t3);font-weight:700;font-family:Nunito,system-ui,sans-serif}
.tip{position:absolute;pointer-events:none;background:var(--t1);color:#000;font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;z-index:2}
.tip.on{opacity:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--s2);display:block}
.heatwrap{display:flex;gap:6px}
.heatwrap .wd{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--t3);font-weight:800}
.heatwrap .wd span{display:flex;align-items:center;height:100%}
.heat-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--t3);font-weight:700;margin-top:10px}
.heat-leg i{width:10px;height:10px;border-radius:2px;display:block}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 12px}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:700;font-size:14px}
.srow i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.srow span:nth-child(2){flex:1}
.srow span:last-child{color:var(--t2)}
.log{list-style:none}
.log li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--s2)}
.log li:last-child{border-bottom:none}
.log .bul{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 36px}
.log .bul svg{width:18px;height:18px}
.log .mid{flex:1;min-width:0}
.log .mid b{display:block;font-weight:800;overflow-wrap:anywhere}
.log .mid small{color:var(--t2);font-size:12.5px;font-weight:700}
.log .rt{font-size:13px;font-weight:800;color:var(--t2);white-space:nowrap}
.btnrow{display:flex;gap:10px}
.pill{flex:1;padding:14px;border-radius:var(--r-md);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--s1)}
.pill svg{width:18px;height:18px;stroke:currentColor}
.pill.pri{background:var(--move);color:#000}

/* habits page */
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.hgrid .tile{width:auto}
.hgrid .tile .disc{width:88px;height:88px}
.hgrid .tile .disc .ic{inset:13px}
.hgrid .tile .disc .ic svg{width:30px;height:30px}
.hgrid .tile .nm{font-size:13.5px}
.hgrid .tile .st{font-size:12px;font-weight:800;color:var(--t3);margin-top:1px}
.hgrid .tile.on .st{color:var(--hc)}
.hgrid .tile .x{position:absolute;top:-4px;right:-4px;width:26px;height:26px;border-radius:50%;background:var(--s3);display:none;place-items:center;z-index:2}
.hgrid .tile .x svg{width:12px;height:12px;stroke:var(--t1)}
.editing .hgrid .tile .x{display:grid}
.editing .hgrid .tile .disc{animation:wob .3s ease infinite alternate}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.addtile .disc .ic{background:none!important;border:2px dashed var(--s3)}
.mgrid{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.mrow svg.hi{width:18px;height:18px}
.mcells{display:grid;grid-template-columns:repeat(28,1fr);gap:2px}
.mcells i{aspect-ratio:1;border-radius:2px;background:var(--s2);display:block}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(18,18,20,.82);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid rgba(255,255,255,.07);padding-bottom:var(--safe-b)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--t3);text-decoration:none;font-size:11px;font-weight:800}
.tabbar a svg{width:25px;height:25px;stroke:currentColor}
.tabbar a.on{color:var(--t1)}
.tabbar a.on[data-v=today]{color:var(--todo)} .tabbar a.on[data-v=study]{color:var(--study)} .tabbar a.on[data-v=eng]{color:var(--eng)} .tabbar a.on[data-v=body]{color:var(--move)} .tabbar a.on[data-v=habits]{color:var(--habit)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet .in{max-width:520px;margin:0 auto;background:var(--s1);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b));max-height:88vh;overflow-y:auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px;position:relative;cursor:grab}
.grab::after{content:"";position:absolute;inset:-14px -60px}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:15px;color:var(--t2);font-weight:800}
.fl{font-size:13px;font-weight:800;color:var(--t2);margin:16px 0 8px}
.field{width:100%;background:var(--s2);border-radius:12px;padding:12px 14px;font-weight:700}
.field::placeholder{color:var(--t3)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--s2);border-radius:12px;padding:8px 6px;text-align:center}
.step .sv{display:flex;align-items:center;justify-content:space-between}
.step .sv button{width:30px;height:30px;border-radius:9px;background:var(--s3);font-weight:900;font-size:18px;line-height:1}
.step .sv input{width:100%;min-width:0;text-align:center;font-size:20px;font-weight:900;font-family:Nunito,system-ui}
.step .sl{font-size:11.5px;color:var(--t2);font-weight:800;margin-top:3px}
.hint{font-size:12.5px;color:var(--t2);font-weight:700;margin-top:8px;min-height:18px}
.go{width:100%;margin-top:22px;padding:15px;border-radius:14px;font-weight:900;font-size:16px;color:#000;background:var(--t1)}
.icpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icpick button{aspect-ratio:1;border-radius:12px;background:var(--s2);display:grid;place-items:center;border:2px solid transparent}
.icpick button svg{width:22px;height:22px;stroke:var(--t1)}
.icpick button.on{border-color:var(--t1)}
.colpick{display:flex;gap:10px}
.colpick button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colpick button.on{border-color:var(--t1)}

.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-10px);background:var(--s2);color:var(--t1);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:.22s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;color:var(--t3);font-size:12.5px;font-weight:800;margin-top:10px;list-style:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{padding:5px 2px;border-bottom:1px solid var(--s2);text-align:left}
th{color:var(--t3)}

/* v3 */
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center;margin-bottom:4px}
.iconbtn svg{width:20px;height:20px;stroke:var(--t2)}
.topr{display:flex;align-items:center;gap:12px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.mini{background:var(--s1);border-radius:18px;padding:13px 14px;text-decoration:none;color:inherit;display:block}
.mini.wide{grid-column:1/-1}
.mini .mt{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.mini .mt svg{width:15px;height:15px;stroke:currentColor}
.mini .mv{font-size:24px;letter-spacing:-.3px;margin-top:4px;line-height:1.15}
.mini .mv small{font-size:12px;color:var(--t2);font-weight:700}
.mini .ms,.ms{font-size:12.5px;color:var(--t2);font-weight:700}
.mrow2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.eb{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:9px;background:var(--s2);color:var(--t2)}
.eb.ok{background:color-mix(in srgb,var(--eng) 22%,transparent);color:var(--eng)}
.k{font-size:12.5px;font-weight:800;color:var(--t2)}
.subjs{display:grid;gap:8px}
.subj{display:block;width:100%;text-align:left;background:var(--s1);border-radius:16px;padding:13px 14px}
.subj .sh{display:flex;align-items:center;gap:9px}
.subj .sh i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.subj .sh b{flex:1;font-weight:800;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj .sh span{font-size:13px;color:var(--t2)}
.subj .ss{font-size:12px;color:var(--t2);font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj.add{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--t2);font-weight:800;background:none;border:1.5px dashed var(--s3)}
.subj.add svg{width:16px;height:16px;stroke:currentColor}
.pbar{display:flex;height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:9px}
.pbar div{height:100%}
.topics{list-style:none;display:grid;gap:6px}
.topics li{display:flex;align-items:center;gap:6px}
.tp{flex:1;display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:12px;padding:11px 12px;text-align:left;min-width:0}
.tp .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--s3);flex:0 0 14px}
.tp.s1 .dot{border-color:var(--sc);background:linear-gradient(90deg,var(--sc) 50%,transparent 50%)}
.tp.s2 .dot{border-color:var(--sc);background:var(--sc)}
.tp .t{flex:1;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.tp.s2 .t{color:var(--t2)}
.tp .st{font-size:11.5px;font-weight:800;color:var(--t3);white-space:nowrap}
.tp.s1 .st,.tp.s2 .st{color:var(--sc)}
.linkbtn{color:var(--study);font-weight:800;font-size:14px;padding:8px 0;display:block;margin:6px auto 0}
.linkbtn.danger{color:var(--move)}
.bseg-wrap{position:sticky;top:calc(6px + var(--safe-t));z-index:4;padding:6px 0;background:var(--bg)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ph b{font-size:17px;font-weight:900}
.exl{list-style:none;display:grid;gap:8px;margin-top:8px}
.exl li{background:var(--s2);border-radius:14px;padding:11px 12px}
.exl li.on{opacity:.55}
.exl .et{display:flex;justify-content:space-between;gap:2px 8px;align-items:baseline;flex-wrap:wrap}
.exl .t{font-weight:800;font-size:14.5px}
.exl .sr{font-size:13px;color:var(--t2);white-space:nowrap}
.exl .en{font-size:12px;color:var(--t2);font-weight:700;margin-top:3px;line-height:1.4}
.setdots{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sd{width:34px;height:34px;border-radius:10px;background:var(--s3);font-weight:900;font-size:13px;color:var(--t2);display:grid;place-items:center}
.sd svg{width:15px;height:15px;stroke:#000}
.sd.on{background:var(--move)}
.warmrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:color-mix(in srgb,var(--todo) 12%,var(--s2));border-radius:14px;padding:11px 12px}
.warmrow>svg{width:22px;height:22px;flex:0 0 22px}

.wc{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--t2);font-weight:700;margin-top:6px}
.fbbox{background:color-mix(in srgb,var(--eng) 14%,var(--s2));border-radius:16px;padding:14px;margin-top:16px}

/* training card */
.pc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-k{font-size:12.5px;font-weight:800;color:var(--t2)}.pc-t{font-size:24px;font-weight:900;letter-spacing:-.01em;margin-top:2px}

.pc-stats>div{display:flex;flex-direction:column;gap:2px}.pc-stats>div+div{padding-left:14px;border-left:1px solid var(--s3)}
.pc-stats span{font-size:12px;font-weight:800;color:var(--t2)}.pc-stats b{font-size:22px;font-weight:900;line-height:1.1}.pc-stats b small{font-size:13px;color:var(--t2);font-weight:800}
.pc-bar{height:4px;border-radius:2px;background:var(--s3);margin:14px 0;overflow:hidden}.pc-bar i{display:block;height:100%;background:var(--move);border-radius:2px;transition:width .4s}
.pc-go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:16px;background:var(--move);color:#000;font-weight:900;font-size:16px}

.pc-warm span{flex:1;min-width:0}.pc-warm span b{display:block;font-weight:900}.pc-warm span small{display:block;font-size:12.5px;color:var(--t2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-warm em{flex:0 0 auto;font-style:normal;font-weight:900;color:var(--todo);white-space:nowrap}.pc-warm em small{font-size:12px}
.pc-how{flex:0 0 auto;padding:0 14px;border-radius:16px;background:var(--s2);font-weight:800;font-size:13px;color:var(--t2)}
.pc-sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px;font-size:12.5px;font-weight:800;color:var(--t2)}

.ex-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ex-n{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:900;font-size:14px}
.pc-ex>li.open .ex-n{background:var(--move);color:#000}.pc-ex>li.done .ex-n{background:var(--habit)}.ex-n svg{width:16px;height:16px;stroke:#000}
.ex-t{flex:1;min-width:0}.ex-t b{display:block;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ex-t small{display:block;font-size:12.5px;color:var(--t2);font-weight:700;margin-top:1px}

.ex-b{padding:0 14px 14px 56px}
.ex-note{font-size:12.5px;color:var(--t2);font-weight:700;line-height:1.45;margin-bottom:8px}
.pc-ex .lift{display:flex;align-items:center;gap:8px;margin:0}

<div class="app">
  <section id="v-today">
    <div class="top"><div><div class="sub dsub"></div><h1 data-t="tabToday"></h1></div><div class="topr"><div class="sync" id="sync"></div><button class="iconbtn" id="open-settings" aria-label="settings"><svg><use href="#i-gear"/></svg></button></div></div>
    <div id="plus-today"></div>
    <div class="hero"><div id="rings"></div><div class="legend" id="lg"></div></div>
    <div class="minis" id="minis"></div>
    <h2><span data-t="habits"></span> <a class="side" href="#habits" style="color:var(--t2);text-decoration:none" data-t="all"></a></h2>
    <div class="tiles" id="t-habits"></div>
    <h2><span data-t="todo"></span> <span class="side" id="td-left"></span></h2>
    <form class="add" id="todo-form"><input id="todo-in" maxlength="120" autocomplete="off"><button class="plus" aria-label="add"><svg><use href="#i-plus"/></svg></button></form>
    <ul class="todos" id="todo-list"></ul>
    <div id="plus-buddies"></div>
    <h2 data-t="thisWeek"></h2>
    <div class="panel"><div class="week" id="week"></div></div>
  </section>

  <section id="v-study">
    <div class="top"><div><div class="sub" id="f-sub"></div><h1 data-t="focus"></h1></div></div>
    <div class="seg" id="mode-seg"><button data-m="focus" class="on"></button><button data-m="break"></button></div>
    <div class="dial"><svg viewBox="0 0 300 300" id="dial-svg"></svg><div class="center"><div class="time num" id="tm">25:00</div><div class="what" id="tm-what"></div></div></div>
    <div class="chips" id="subj-chips"></div>
    <div class="ctl">
      <button class="small" id="tm-reset" aria-label="reset"><svg><use href="#i-reset"/></svg></button>
      <button class="big" id="tm-start" aria-label="start"><svg><use href="#i-play"/></svg></button>
      <button class="small" id="tm-stop" aria-label="stop"><svg><use href="#i-stop"/></svg></button>
    </div>
    <div class="dur" id="dur"></div>
    <div id="plus-focus"></div>
    <h2><span data-t="progress"></span></h2>
    <div class="subjs" id="subj-prog"></div>
    <h2><span data-t="week"></span> <button class="side" id="open-manual" data-t="logTime"></button></h2>
    <div class="panel"><div class="kpi" id="k-study"></div><div class="chart" id="week-chart"></div></div>
    <h2><span data-t="weeks16"></span> <span class="side" id="heat-total"></span></h2>
    <div class="panel"><div class="heatwrap"><div class="wd" id="heat-wd"></div><div class="heat" id="heat" style="flex:1"></div></div>
      <div class="heat-leg"><span data-t="less"></span><i style="background:var(--s2)"></i><i style="background:#26407a"></i><i style="background:#3a5fb8"></i><i style="background:#4b78e6"></i><i style="background:#7ea6ff"></i><span data-t="more"></span></div></div>
    <h2><span data-t="subjects"></span> <span class="side" data-t="last30"></span></h2>
    <div class="panel" id="subj-split"></div>
    <h2 data-t="recent"></h2>
    <div class="panel"><ul class="log" id="study-log"></ul></div>
  </section>

  <section id="v-eng"><div id="eng-root"></div></section>

  <section id="v-body">
    <div class="top"><div><div class="sub dsub"></div><h1 data-t="tabBody"></h1></div></div>
    <div class="bseg-wrap"><div class="seg" id="body-seg" style="width:100%;display:grid;grid-template-columns:repeat(3,1fr)"><button data-s="train" data-t="training"></button><button data-s="food" data-t="food"></button><button data-s="fast" data-t="fast"></button></div></div>
    <div class="bseg" data-s="train">
      <h2 data-t="plan"></h2>
      <div class="panel" id="plan-card"></div>
      <div class="btnrow" style="margin-top:12px">
        <button class="pill pri" id="open-workout"><svg><use href="#i-plus"/></svg><span data-t="logWorkout"></span></button>
        <button class="pill" id="open-weight"><svg><use href="#i-scale"/></svg><span data-t="logWeight"></span></button>
      </div>
      <h2><span data-t="today"></span> <span class="side" id="mv-today"></span></h2>
      <div class="panel"><ul class="log" id="today-moves"></ul></div>
      <h2><span data-t="week"></span> <span class="side" id="mv-week"></span></h2>
      <div class="panel"><div class="chart" id="move-chart"></div></div>
      <h2><span data-t="weight"></span> <span class="side" id="w-delta"></span></h2>
      <div class="panel"><div class="kpi" id="w-kpi"></div><div class="chart" id="w-chart"></div></div>
      <h2 data-t="history"></h2>
      <div class="panel"><ul class="log" id="move-log"></ul></div>
    </div>
    <div class="bseg" data-s="food">
      <h2 data-t="calories"></h2>
      <div class="panel"><div class="kcal-row" id="kcal-hero"></div><div id="kcal-note"></div></div>
      <div class="btnrow" style="margin-top:12px"><button class="pill" id="open-food" style="background:var(--todo);color:#000"><svg><use href="#i-plus"/></svg><span data-t="logFood"></span></button><button class="pill" id="open-reco"><svg><use href="#i-spark"/></svg><span data-t="aiReco"></span></button></div>
      <h2 data-t="today"></h2>
      <div class="panel" id="meals"></div>
      <h2 data-t="weekKcal"></h2>
      <div class="panel"><div class="chart" id="kcal-chart"></div></div>
      <div class="hint" data-t="approx"></div>
    </div>
    <div class="bseg" data-s="fast">
      <h2 data-t="fasting"></h2>
      <div class="panel" id="fast-hero"></div>
      <h2 data-t="last7"></h2>
      <div class="panel" id="fast-hist"></div>
    </div>
  </section>

  <section id="v-habits">
    <div class="top"><div><div class="sub dsub"></div><h1 data-t="tabHabits"></h1></div><button class="tbtn" id="h-edit"></button></div>
    <div id="h-wrap"><div class="hgrid" id="h-grid"></div></div>
    <h2 data-t="weeks4"></h2>
    <div class="panel"><div class="mgrid" id="h-month"></div></div>
  </section>
</div>
